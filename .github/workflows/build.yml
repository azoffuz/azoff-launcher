name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release versiyasi (masalan 1.0.0). Bo'sh qoldirsangiz faqat APK build bo'ladi."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versiyani aniqlash
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="1.0.${{ github.run_number }}-dev"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Keystore (agar secret berilgan bo'lsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Bo'sh secretlar standart qiymatga qaytsin
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD
          [ -z "$KEY_ALIAS" ] && unset KEY_ALIAS
          [ -z "$KEY_PASSWORD" ] && unset KEY_PASSWORD
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -PappVersionCode=${{ steps.ver.outputs.code }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AzoffLauncher-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AzoffLauncher-${{ steps.ver.outputs.name }}
          path: out/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          gh release create "$TAG" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Azoff Launcher $TAG" \
            --generate-notes
